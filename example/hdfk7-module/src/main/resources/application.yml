spring:
  application:
    name: module
  cloud:
    nacos:
      discovery:
        username: username
        password: password
        server-addr: ip:8848
      config:
        username: username
        password: password
        server-addr: ip:8848
        file-extension: yaml
  config:
    import:
      - nacos:${spring.application.name}?refreshEnabled=true
springdoc:
  api-docs:
    enabled: true
  open-api:
    info:
      version: 1.0.0
      description: "[${spring.application.name}]接口文档"
  group-configs:
    - group: "默认分组"
      paths-to-match:
        - /**
